.sr .pres dt{font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}

.sr .pact{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}

.sr .fixed{font-weight:800;color:var(--ink);background:var(--mist);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-height:44px}

.sr ul.clients.per{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sr ul.clients.per li span{display:block;margin-top:2px;font-size:.82rem;font-weight:600;color:var(--leaf);font-variant-numeric:tabular-nums}
.sr .mqwrap{position:relative;overflow:hidden;margin:0 -4px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.sr .mqtrack{display:flex;width:max-content;gap:10px;animation:sr-mq 95s linear infinite;padding:4px}
@media (hover:hover){.sr .mqwrap:hover .mqtrack{animation-play-state:paused}}
.sr .mqwrap:focus-within .mqtrack,.sr .mqwrap.tap-paused .mqtrack{animation-play-state:paused}
.sr .mqwrap{cursor:grab;touch-action:pan-y}
.sr .mqwrap.mq-dragging{cursor:grabbing}
.sr .mqcard{flex:0 0 auto;white-space:nowrap;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 16px;font-weight:700;font-size:.92rem;color:var(--ink)}
.sr .mqcard span{display:block;margin-top:2px;font-size:.82rem;font-weight:600;color:var(--leaf);font-variant-numeric:tabular-nums;white-space:nowrap}
@keyframes sr-mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.sr .mqtrack{animation:none}.sr .mqwrap{overflow-x:auto}}
@media (max-width:900px){.sr .mqtrack{animation-duration:70s}}
.sr .galon.foto > img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:contain}
.sr .galon.foto .glabel{border-radius:3%/2.2%;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.sr .galon.foto .glabel::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(0,0,0,0) 10%,rgba(255,255,255,.07) 30%,rgba(0,0,0,0) 45%,rgba(0,0,0,0) 88%,rgba(0,0,0,.22))}
@media (max-width:900px){
.sr ul.clients.per{grid-template-columns:repeat(2,minmax(0,1fr))}
.sr .pgrid,.sr .reqgrid{grid-template-columns:minmax(0,1fr);gap:24px}

}
@media (max-width:900px){

.sr .hero .wrap{grid-template-columns:minmax(0,1fr);gap:32px;padding-block:44px 52px}
.sr .casegrid{grid-template-columns:minmax(0,1fr);gap:28px}

.sr .lb{padding:64px 8px}
.sr .lb-prev,.sr .lb-next{top:auto;bottom:12px;margin-top:0}
.sr ul.casefacts li{grid-template-columns:minmax(0,1fr);gap:2px}
.sr .heroimg .cmp{aspect-ratio:4 / 3}
.sr .contactgrid,.sr .frow{grid-template-columns:minmax(0,1fr)}
.sr .quotebox{padding:20px}
.sr .wa span{display:none}
.sr .wa{padding:12px}
.sr .hero::before{width:90px;opacity:.26}
.sr .areas{grid-template-columns:repeat(2,minmax(0,1fr))}
.sr .area:last-child{grid-column:1 / -1}
.sr .cols2,.sr .split,.sr .split.rev,.sr .founder{grid-template-columns:minmax(0,1fr);gap:28px}
.sr .pillars,.sr .svc,.sr .parts,.sr .mv,.sr .pcaps{grid-template-columns:minmax(0,1fr);gap:24px}
.sr .photorow{grid-template-columns:minmax(0,1fr);gap:20px}
.sr .strip ul{grid-template-columns:repeat(2,minmax(0,1fr))}
.sr .team{grid-template-columns:repeat(2,minmax(0,1fr))}
.sr .row{grid-template-columns:minmax(0,1fr);gap:2px}
.sr .timeline li{grid-template-columns:minmax(0,1fr);gap:2px}
.sr .cmp{aspect-ratio:4 / 3}
}

<section id="empresa">
<div class="wrap">
<div class="cols2">
<div>
<p class="kicker">Who we are</p>
<h2>A Venezuelan agro-environmental company</h2>
<p class="lead">Bio-treatment of hydrocarbon-impacted soils using proprietary technology for environmental recovery, soil stabilization, and the restoration of ecosystems affected by industrial and oil activity.</p>
<p class="note"><strong>Headquarters:</strong> Barcelona, Anzoátegui state, Venezuela.</p>
</div>
<div class="panel">
<h3>Objectives</h3>
<ul class="tick">
<li>Reduce the impact of soil contamination.</li>
<li>Minimize the use of agrochemicals.</li>
<li>Support biota in impacted soils.</li>
<li>Generate environmental, social and economic value.</li>
</ul>
</div>
</div>
<div class="pillars">
<div class="pillar"><h3>Constant innovation</h3><p>We seek technological, operational and innovative solutions to environmental problems.</p></div>
<div class="pillar"><h3>Economic efficiency</h3><p>Technology that minimizes the investment needed to reduce man-made environmental liabilities.</p></div>
<div class="pillar"><h3>Reliability</h3><p>Proven field results, backed by science and more than three decades of projects.</p></div>
</div>
<div class="mv" id="mision-vision">
<div class="mv-card"><p class="kicker">Mission</p><h3>Repairing environmental damage with our own solutions</h3><p>To provide a specialized agro-environmental service that counteracts the environmental consequences of oil exploitation and remedies the damage immediately, in line with the international treaties Venezuela has signed on ecology and environmentalism.</p></div>
<div class="mv-card"><p class="kicker">Vision</p><h3>A highly reliable agro-environmental company</h3><p>To be a highly reliable agro-environmental services company, permanently driven to find technological, operational and innovative solutions to environmental problems while taking into account our clients' economic needs.</p></div>
</div>
</div>
</section>

<div class="head">
<p class="kicker">Areas of work</p>
<h2>Our services</h2>
<p class="lead">Bioremediation is our core work, supported by complementary production and advisory lines.</p>
</div>
<div class="svc">
<a class="main" href="#biorremediacion"><p class="tag">Main service</p><h3>Soil bioremediation</h3><p>Recovery of hydrocarbon-contaminated soils through biological processes.</p></a>
<a href="#lombricultura"><p class="tag">Production</p><h3>Vermiculture and organic fertilizers</h3><p>Humus and biofertilizers made with California red worms, plus natural fertilizers from organic waste.</p></a>
<a href="#contacto"><p class="tag">Consulting</p><h3>Environmental advisory</h3><p>Technical guidance on soil care and environmental compliance for projects.</p></a>
<a href="#cobernet"><p class="tag">Projects</p><h3>Erosion control</h3><p>Slope stabilization and protection with Cobernet.</p></a>
<a href="#forestal"><p class="tag">Projects</p><h3>Forestry management</h3><p>Reforestation, revegetation and compensation forests.</p></a>
<a href="#obras"><p class="tag">Projects</p><h3>Pit waterproofing</h3><p>Pit protection to prevent leachate from contaminating materials.</p></a>
</div>
</div>

<section id="biorremediacion">
<div class="wrap">
<div class="cols2">
<div>
<p class="kicker">Accelerated in-situ landfarming recovery</p>
<h2>In-situ bioremediation with proprietary technology</h2>
<p class="lead">Contaminated soil is recovered on-site through biological processes, until it reaches the levels required by environmental regulations.</p>
</div>
<div>
<ol class="steps">
<li><strong>Conditioning</strong><span>Collection, homogenization with organic amendments, turning and mechanical aeration.</span></li>
<li><strong>Moisture control</strong><span>Optimal conditions for the microbiota.</span></li>
<li><strong>Biostimulation</strong><span>Fulvic solutions and specialized microorganisms.</span></li>
<li><strong>Accelerated degradation</strong><span>Reduction of SARA to regulatory levels.</span></li>
</ol>
</div>
</div>
<div class="strip">
<div class="photo"><img src="images/77f6697fc4de07d090bbde9eae093dce.jpg" alt="Four stages of in-situ landfarming in the field" width="1400" height="343" style="cursor: zoom-in" tabIndex="0" role="button" aria-label="Enlarge photo: four stages of landfarming" data-on-click="{{openQuadBio}}"></div>
<ul>
<li><strong>1 · Collection</strong><span>Collection of hydrocarbons from the flare pit to be mixed and bio-treated.</span></li>
<li><strong>2 · Homogenization</strong><span>Placement of contaminated soil to be spread out and homogenized.</span></li>
<li><strong>3 · Turning</strong><span>Mechanical turning and aeration with a grader, spreading the material to be treated.</span></li>
<li><strong>4 · Sampling</strong><span>Homogenization for composite sample collection.</span></li>
</ul>
</div>
</div>

<div>
<div class="parts">
<div><strong>Mesh</strong><span>Photodegradable polyethylene</span></div>
<div><strong>Hay</strong><span>Treated with fulvic acids</span></div>
<div><strong>Thread</strong><span>Biodegradable</span></div>
</div>
<ul class="tick">
<li>Protects the slope from the very first rainfall.</li>
<li>Dissipates rainfall energy.</li>
<li>Minimizes gully formation.</li>
<li>Promotes grass germination.</li>
<li>Local labor and bio- and photodegradable materials.</li>
</ul>
<p class="note wide"><strong>Applied in:</strong> Anzoátegui, Bolívar, Miranda, Monagas and Sucre.</p>

</div>
</div>
</div>
</section>

<section class="tint" id="lombricultura">

<div class="split rev">
<div>
<p class="kicker">Vermiculture</p>
<h2>Organic matter turned into fertility</h2>
<p class="wide">The humus produced by Agroforestal San Remo C.A. accelerates the degradation of hydrocarbons.</p>
</div>
<div class="photo"><img src="images/fb5e01c6b206f2eecd3d393c1f07d49d.jpg" alt="Hand holding humus with California red worms" width="680" height="555" style="cursor: zoom-in" tabIndex="0" role="button" aria-label="Enlarge photo: humus with worms" data-on-click="{{openLombricMano}}"></div>
